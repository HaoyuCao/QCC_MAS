[project]
name = "qcc-framework"
version = "0.1.0"
description = "QCC: Quantify-Collect-Correct — A closed-loop multi-agent framework for evidence-driven emergency diagnosis"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Haoyu Cao", email = "" },
    { name = "Yueze Fu", email = "" },
    { name = "Wenbo Gao", email = "" },
    { name = "Yuxin Lin", email = "" },
    { name = "Xiangyu Li", email = "" },
    { name = "Wei Wang", email = "wangwei2019@hit.edu.cn" },
]
requires-python = ">=3.10"
keywords = ["medical diagnosis", "LLM evaluation", "multi-agent", "emergency room", "evidence-driven", "clinical reasoning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "camel-ai>=0.2.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0.0",
    "tqdm>=4.65.0",
    "matplotlib>=3.7.0",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
]

[project.scripts]
qcc-eval = "qcc.cli:main"
qcc-segment = "qcc.segment:main"
weci = "qcc.weci:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qcc"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
disallow_untyped_defs = true
warn_return_any = true
